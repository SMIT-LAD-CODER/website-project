<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-box.loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        .joke-type {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
            font-weight: normal;
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            min-width: 150px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-copy {
            background: #f0f0f0;
            color: #333;
            padding: 12px 20px;
        }

        .btn-copy:hover {
            background: #e0e0e0;
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #666;
            font-size: 0.9em;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-box {
                font-size: 1.1em;
                padding: 20px;
                min-height: 100px;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh!</p>

        <div class="error" id="error"></div>

        <div class="joke-box" id="jokeBox">
            Click the button to get a joke!
        </div>
        <div class="joke-type" id="jokeType"></div>

        <div class="button-group">
            <button class="btn-generate" id="generateBtn">Get Joke</button>
            <button class="btn-copy" id="copyBtn" title="Copy joke to clipboard">📋 Copy</button>
        </div>

        <div class="stats">
            <p>Jokes loaded: <strong id="jokeCount">0</strong></p>
        </div>
    </div>

    <script>
        let jokeCount = 0;
        let currentJoke = '';

        const jokeBox = document.getElementById('jokeBox');
        const jokeType = document.getElementById('jokeType');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const errorDiv = document.getElementById('error');
        const jokeCountSpan = document.getElementById('jokeCount');

        // Fetch joke from API
        async function fetchJoke() {
            generateBtn.disabled = true;
            jokeBox.classList.add('loading');
            jokeBox.textContent = 'Loading...';
            errorDiv.classList.remove('show');

            try {
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                
                // Format the joke
                currentJoke = `${data.setup} ${data.delivery}`;
                jokeBox.textContent = currentJoke;
                jokeType.textContent = `Type: ${data.type}`;
                
                jokeCount++;
                jokeCountSpan.textContent = jokeCount;

            } catch (error) {
                showError(error.message);
                jokeBox.textContent = 'Failed to load joke. Please try again!';
                jokeType.textContent = '';
            } finally {
                generateBtn.disabled = false;
                jokeBox.classList.remove('loading');
            }
        }

        // Copy joke to clipboard
        function copyJoke() {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Copied!';
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                    }, 2000);
                }).catch(() => {
                    showError('Failed to copy joke');
                });
            }
        }

        // Show error message
        function showError(message) {
            errorDiv.textContent = `Error: ${message}`;
            errorDiv.classList.add('show');
        }

        // Event listeners
        generateBtn.addEventListener('click', fetchJoke);
        copyBtn.addEventListener('click', copyJoke);

        // Load a joke on page load
        fetchJoke();
    </script>
</body>
</html>
